name: Gerar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Extrair o projeto
        run: unzip -q "$(ls *.zip | head -1)" -d mod
      - name: Gerar o .jar
        run: |
          cd mod
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: stalkers-jar
          path: mod/build/libs/*.jar
